# Cross compilation configuration for Raspberry Pi 4 (Cortex-A72, ARMv8-A, Ubuntu 22.04 aarch64)

[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'armv8-a'
endian = 'little'

[built-in options]
werror = false
c_args = ['-O3', '-fopenmp', '-march=armv8-a+crc+simd', '-mtune=cortex-a72', '-mno-outline-atomics', '-I/hdd/workspace/temp/speaker_diarization/nntrainer/tools/sysroot_arm64/usr/include/openblas', '-I/hdd/workspace/temp/speaker_diarization/nntrainer/tools/sysroot_arm64/usr/include']
cpp_args = ['-O3', '-fopenmp', '-march=armv8-a+crc+simd', '-mtune=cortex-a72', '-mno-outline-atomics', '-std=c++17', '-I/hdd/workspace/temp/speaker_diarization/nntrainer/tools/sysroot_arm64/usr/include/openblas', '-I/hdd/workspace/temp/speaker_diarization/nntrainer/tools/sysroot_arm64/usr/include']
c_link_args = ['-fopenmp', '-L/hdd/workspace/temp/speaker_diarization/nntrainer/tools/sysroot_arm64/usr/lib/aarch64-linux-gnu/openblas-pthread', '-L/hdd/workspace/temp/speaker_diarization/nntrainer/tools/sysroot_arm64/usr/lib/aarch64-linux-gnu', '-Wl,-rpath-link,/hdd/workspace/temp/speaker_diarization/nntrainer/tools/sysroot_arm64/usr/lib/aarch64-linux-gnu', '-lopenblas', '-lgfortran']
cpp_link_args = ['-fopenmp', '-L/hdd/workspace/temp/speaker_diarization/nntrainer/tools/sysroot_arm64/usr/lib/aarch64-linux-gnu/openblas-pthread', '-L/hdd/workspace/temp/speaker_diarization/nntrainer/tools/sysroot_arm64/usr/lib/aarch64-linux-gnu', '-Wl,-rpath-link,/hdd/workspace/temp/speaker_diarization/nntrainer/tools/sysroot_arm64/usr/lib/aarch64-linux-gnu', '-lopenblas', '-lgfortran']

[project options]
platform = 'none'
arm-arch = 'none'
enable-fp16 = false
enable-app = true
install-app = true
enable-test = false
enable-logging = true
enable-tflite-backbone = false
enable-nnstreamer-backbone = false
enable-tflite-interpreter = false
enable-mmap = true
mmap-read = true
